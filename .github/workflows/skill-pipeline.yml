name: Skill CI & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip python3-venv

      - name: Bootstrap Venv, Validate Schema & Build Skill Package
        run: make all

      - name: Upload Skill Artifact (CI Preview)
        uses: actions/upload-artifact@v4
        with:
          name: sunless-skies-first-mate-skill
          path: |
            dist/sunless-skies-first-mate.zip
            dist/sunless-skies-first-mate.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sunless-skies-first-mate.zip
            dist/sunless-skies-first-mate.zip.sha256
          generate_release_notes: true